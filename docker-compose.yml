version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: attendai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendai -d attendai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - attendai-network

  redis:
    image: redis:7-alpine
    container_name: attendai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - attendai-network

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai-backend-1
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://attendai:password@postgres:5432/attendai
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
      USE_FAKEREDIS_FALLBACK: "false"
      LLM_PROVIDER: mock
      SECRET_KEY: attendai-production-super-secret-key-32chars
      JWT_SECRET_KEY: attendai-production-jwt-secret-key-32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai-network

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai-backend-2
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://attendai:password@postgres:5432/attendai
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
      USE_FAKEREDIS_FALLBACK: "false"
      LLM_PROVIDER: mock
      SECRET_KEY: attendai-production-super-secret-key-32chars
      JWT_SECRET_KEY: attendai-production-jwt-secret-key-32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendai-frontend
    restart: unless-stopped
    networks:
      - attendai-network

  nginx:
    image: nginx:alpine
    container_name: attendai-loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - frontend
    networks:
      - attendai-network

volumes:
  postgres_data:
  redis_data:

networks:
  attendai-network:
    driver: bridge
